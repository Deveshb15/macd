name: Macd
options:
  bundleIdPrefix: com.devesh
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Macd:
    type: application
    platform: macOS
    sources:
      - path: Macd
    info:
      path: Macd/Resources/Info.plist
      properties:
        CFBundleDisplayName: "mac'd"
        CFBundleName: "mac'd"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Bundles Mole (GPL-3.0) by tw93."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devesh.macd
        PRODUCT_NAME: Macd
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    postCompileScripts:
      - name: Embed Mole
        script: '"${SRCROOT}/scripts/embed-mole.sh"'
        basedOnDependencyAnalysis: false
  MacdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacdTests
    dependencies:
      - target: Macd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devesh.macd.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  Macd:
    build:
      targets:
        Macd: all
        MacdTests: [test]
    test:
      targets:
        - MacdTests
